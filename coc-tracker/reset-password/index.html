<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TH Tracker – Neues Passwort</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #121a26; color: #f4f7fb;
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { width: min(460px, calc(100vw - 32px)); box-sizing: border-box; background: #1d2838; border: 2px solid #070b12;
          border-radius: 16px; padding: 28px 24px; }
  h1 { color: #f6c443; margin: 0 0 8px; font-size: 1.5rem; text-align: center; }
  p { margin: 8px 0; }
  .muted { color: #8d9db5; font-size: .9rem; }
  input { width: 100%; box-sizing: border-box; margin: 6px 0; padding: 12px; border-radius: 12px; border: 2px solid #2b384c;
          background: #0d131c; color: #f4f7fb; font-size: 1rem; }
  button { width: 100%; margin-top: 10px; padding: 12px; border: 2px solid #070b12; border-radius: 12px; background: #7cc444;
           color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: .6; }
  .msg { min-height: 1.4em; }
  .err { color: #e5483f; }
  .ok { color: #7cc444; }
</style>
</head>
<body>
<div class="card">
  <h1 id="title">Neues Passwort</h1>
  <form id="form" hidden>
    <p class="muted">Wähle ein neues Passwort für TH Tracker (mindestens 6 Zeichen). / Choose a new password (at least 6 characters).</p>
    <input id="pw1" type="password" autocomplete="new-password" placeholder="Neues Passwort / New password" required minlength="6">
    <input id="pw2" type="password" autocomplete="new-password" placeholder="Wiederholen / Repeat" required minlength="6">
    <button id="save" type="submit">Speichern / Save</button>
  </form>
  <p id="msg" class="msg"></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script>
  // The link from the email signs in for this one purpose (tokens in the URL) - then the new password is saved.
  const msg = document.getElementById('msg');
  const form = document.getElementById('form');
  const show = (text, kind) => { msg.textContent = text; msg.className = 'msg ' + (kind || ''); };
  const expired = () => {
    document.getElementById('title').textContent = 'Link nicht mehr gültig';
    show('Der Link ist abgelaufen oder wurde schon benutzt. Fordere in der App einen neuen an. / The link expired or was used already - request a new one in the app.', 'err');
  };
  if (/error/.test(location.hash + location.search) || !/access_token/.test(location.hash)) {
    expired();
  } else {
    const client = supabase.createClient('https://bzbzluyjiirpgedqmrac.supabase.co', 'sb_publishable_6sfxDxnfOY7DvenSOKg_lg_bFXbq9wl', {
      auth: { persistSession: false, detectSessionInUrl: true },
    });
    client.auth.getSession().then(({ data }) => {
      if (!data.session) return expired();
      history.replaceState(null, '', location.pathname);
      form.hidden = false;
    });
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = document.getElementById('pw1').value;
      if (pw !== document.getElementById('pw2').value) return show('Die Passwörter sind verschieden. / The passwords differ.', 'err');
      const button = document.getElementById('save');
      button.disabled = true;
      const { error } = await client.auth.updateUser({ password: pw });
      button.disabled = false;
      if (error) return show(error.message, 'err');
      form.hidden = true;
      document.getElementById('title').textContent = '✅ Passwort geändert';
      show('Geh zurück in die App und melde dich mit dem neuen Passwort an. / Go back to the app and sign in with the new password.', 'ok');
      client.auth.signOut();
    });
  }
</script>
</body>
</html>
